<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<title>Call outcome taxonomy used as an evaluation framework: every call gets one disposition, grouped into fully completed by NEO, partially completed, and needs human follow-up, with the share of calls in each group and a proposed fulfilment roll-up.</title>
<defs><style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#595959}
.h{font-size:18px;font-weight:600;fill:#111}
.h2{font-size:15px;font-weight:600;fill:#111}
.b{font-size:14px;fill:#111}
.m{font-size:13px;fill:#595959}
.s{font-size:12px;fill:#595959}
.w{fill:#fff}
.c{fill:#fff;stroke:#e6e6e6;stroke-width:1.5}
.r{fill:#fafafa;stroke:#e6e6e6;stroke-width:1.5}
.a{stroke:#111;stroke-width:1.5;fill:none}
.ad{stroke:#8a8a8a;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.hl{stroke:#e6e6e6;stroke-width:1.5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
</defs>

<rect width="1200" height="600" fill="#fff"/>
<text x="40" y="48" class="k">EVALUATION FRAMEWORK · CALL OUTCOME TAXONOMY</text>
<text x="40" y="76" class="h">One disposition per call, so performance can be measured honestly</text>

<rect x="40" y="250" width="180" height="80" rx="4" fill="#111"/>
<text x="130" y="284" text-anchor="middle" class="w" style="font-size:15px;font-weight:600">Call handled</text>
<text x="130" y="304" text-anchor="middle" class="w" style="font-size:15px;font-weight:600">by NEO</text>

<g class="a">
<path d="M220 280 C 260 280, 260 160, 292 160" marker-end="url(#ar)"/>
<path d="M220 290 H 292" marker-end="url(#ar)"/>
<path d="M220 300 C 260 300, 260 430, 292 430" marker-end="url(#ar)"/>
</g>

<!-- groups -->
<rect x="300" y="110" width="520" height="100" rx="4" class="c"/>
<rect x="300" y="110" width="5" height="100" fill="#0F766E"/>
<text x="324" y="140" class="k" style="fill:#0F766E">FULLY COMPLETED BY NEO</text>
<g style="font-size:13px;font-weight:600" fill="#0F766E">
<rect x="324" y="158" width="140" height="30" rx="15" fill="#E7F3F1"/><text x="394" y="178" text-anchor="middle">Bot Self-Served</text>
<rect x="474" y="158" width="250" height="30" rx="15" fill="#E7F3F1"/><text x="599" y="178" text-anchor="middle">Transfer Failed · bot completed</text>
</g>

<rect x="300" y="240" width="520" height="100" rx="4" class="c"/>
<rect x="300" y="240" width="5" height="100" fill="#B54708"/>
<text x="324" y="270" class="k" style="fill:#B54708">PARTIALLY COMPLETED</text>
<g style="font-size:13px;font-weight:600" fill="#B54708">
<rect x="324" y="288" width="160" height="30" rx="15" fill="#FEF4E6"/><text x="404" y="308" text-anchor="middle">Transfer Answered</text>
<rect x="494" y="288" width="260" height="30" rx="15" fill="#FEF4E6"/><text x="624" y="308" text-anchor="middle">Transfer Failed · message taken</text>
</g>

<rect x="300" y="370" width="520" height="120" rx="4" class="c"/>
<rect x="300" y="370" width="5" height="120" fill="#B42318"/>
<text x="324" y="400" class="k" style="fill:#B42318">NEEDS HUMAN FOLLOW-UP</text>
<g style="font-size:13px;font-weight:600" fill="#B42318">
<rect x="324" y="418" width="150" height="30" rx="15" fill="#FDECEC"/><text x="399" y="438" text-anchor="middle">Transfer Missed</text>
<rect x="484" y="418" width="200" height="30" rx="15" fill="#FDECEC"/><text x="584" y="438" text-anchor="middle">Conversation Abandoned</text>
<rect x="324" y="454" width="160" height="30" rx="15" fill="#FDECEC"/><text x="404" y="474" text-anchor="middle">Insufficient Details</text>
</g>

<!-- right panel -->
<rect x="860" y="110" width="300" height="200" rx="4" class="r"/>
<text x="880" y="142" class="k">ROLL-UP ACROSS CALLS</text>
<rect x="880" y="166" width="104" height="30" fill="#0F766E"/>
<rect x="984" y="166" width="78" height="30" fill="#B54708"/>
<rect x="1062" y="166" width="78" height="30" fill="#595959"/>
<g style="font-size:14px;font-weight:600">
<text x="880" y="222" fill="#0F766E">~40%</text><text x="984" y="222" fill="#B54708">~30%</text><text x="1062" y="222" fill="#595959">the rest</text>
</g>
<g class="s">
<text x="880" y="240">fully</text><text x="984" y="240">partially</text><text x="1062" y="240">follow-up</text>
</g>
<text x="880" y="280" class="s">The same groups power the AI Front</text>
<text x="880" y="296" class="s">Desk view and the renewal dashboard.</text>
<rect x="860" y="330" width="300" height="160" rx="4" class="r"/>
<text x="880" y="362" class="k">RULES</text>
<text x="880" y="392" class="b">Exactly one label per call</text>
<text x="880" y="418" class="b">Bot not held responsible once</text>
<text x="880" y="436" class="b">staff have answered</text>
<text x="880" y="462" class="b">Separate wording for dashboards</text>
<text x="880" y="480" class="b">vs formal reports</text>

<text x="40" y="550" class="s">Roll-up (proposed in the warm transfer spec): "bot completed" counts as a fulfilled call; "message taken" as unfulfilled.</text>
</svg>
