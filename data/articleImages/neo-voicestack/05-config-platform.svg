<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<title>Configurable bot platform: a configuration of about 20 inputs (practice details, function toggles and editable wording) is rendered through one standard template into a prompt and deployed by the implementation team without code. Setup time fell from 20–25 days to about half an hour, and the engineering and QA time spent building bots was returned to product work.</title>
<defs><style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#595959}
.h{font-size:18px;font-weight:600;fill:#111}
.h2{font-size:15px;font-weight:600;fill:#111}
.b{font-size:14px;fill:#111}
.m{font-size:13px;fill:#595959}
.s{font-size:12px;fill:#595959}
.w{fill:#fff}
.c{fill:#fff;stroke:#e6e6e6;stroke-width:1.5}
.r{fill:#fafafa;stroke:#e6e6e6;stroke-width:1.5}
.a{stroke:#111;stroke-width:1.5;fill:none}
.ad{stroke:#8a8a8a;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.hl{stroke:#e6e6e6;stroke-width:1.5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
</defs>

<rect width="1200" height="700" fill="#fff"/>
<text x="40" y="48" class="k">CONFIGURABLE BOT PLATFORM</text>
<text x="40" y="76" class="h">One template, configured per practice, deployed without engineering</text>

<!-- config form -->
<text x="40" y="122" class="k">CONFIGURATION · 20+ INPUTS</text>
<rect x="40" y="136" width="420" height="510" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="60" y="168" class="h2">Practice details</text>
<text x="300" y="168" class="s">variables</text>
<g class="m">
<rect x="60" y="182" width="380" height="34" rx="4" class="r"/><text x="72" y="204">Working hours</text><text x="428" y="204" text-anchor="end" fill="#111" style="fill:#111">Mon–Fri · 8:00–17:00</text>
<rect x="60" y="222" width="380" height="34" rx="4" class="r"/><text x="72" y="244">Address</text><text x="428" y="244" text-anchor="end">free text</text>
<rect x="60" y="262" width="380" height="34" rx="4" class="r"/><text x="72" y="284">Providers</text><text x="428" y="284" text-anchor="end">list</text>
<rect x="60" y="302" width="380" height="34" rx="4" class="r"/><text x="72" y="324">Accepted insurance</text><text x="428" y="324" text-anchor="end">list</text>
</g>
<line x1="60" y1="352" x2="440" y2="352" class="hl"/>
<text x="60" y="380" class="h2">Functions</text>
<text x="300" y="380" class="s">toggles</text>
<g class="b">
<text x="60" y="412">New patient booking</text>
<text x="60" y="444">Existing patient booking</text>
<text x="60" y="476">Offer reschedule on cancel</text>
</g>
<g>
<rect x="400" y="398" width="40" height="22" rx="11" fill="#0F766E"/><circle cx="429" cy="409" r="8" fill="#fff"/>
<rect x="400" y="430" width="40" height="22" rx="11" fill="#0F766E"/><circle cx="429" cy="441" r="8" fill="#fff"/>
<rect x="400" y="462" width="40" height="22" rx="11" fill="#d9d9d9"/><circle cx="411" cy="473" r="8" fill="#fff"/>
</g>
<line x1="60" y1="496" x2="440" y2="496" class="hl"/>
<text x="60" y="524" class="h2">Wording</text>
<text x="300" y="524" class="s">editable per moment</text>
<g style="font-size:12px" fill="#111">
<rect x="60" y="540" width="84" height="28" rx="14" class="r"/><text x="102" y="558" text-anchor="middle">Greeting</text>
<rect x="152" y="540" width="84" height="28" rx="14" class="r"/><text x="194" y="558" text-anchor="middle">Sign-off</text>
<rect x="244" y="540" width="110" height="28" rx="14" class="r"/><text x="299" y="558" text-anchor="middle">Cost question</text>
<rect x="60" y="576" width="160" height="28" rx="14" class="r"/><text x="140" y="594" text-anchor="middle">Insurance not taken</text>
<rect x="228" y="576" width="90" height="28" rx="14" class="r"/><text x="273" y="594" text-anchor="middle">+ more</text>
</g>
<text x="60" y="630" class="s">Toggles, enums, ranges and free-text inputs</text>

<!-- pipeline -->
<text x="500" y="122" class="k">AUTOMATED</text>
<g class="h2" text-anchor="middle">
<rect x="500" y="136" width="240" height="64" rx="4" class="r"/><text x="620" y="173">Configuration</text>
<rect x="500" y="236" width="240" height="64" rx="4" class="r"/><text x="620" y="273">Standard template</text>
<rect x="500" y="336" width="240" height="64" rx="4" class="r"/><text x="620" y="373">Rendered prompt</text>
<rect x="500" y="436" width="240" height="64" rx="4" class="r"/><text x="620" y="473">Bot Builder</text>
<rect x="500" y="536" width="240" height="64" rx="4" fill="#0F766E"/><text x="620" y="564" class="w" style="fill:#fff">Live bot</text>
</g>
<text x="620" y="586" text-anchor="middle" style="font-size:12px" fill="#E7F3F1">one or many locations, same day</text>
<g class="a">
<path d="M620 200 V 228" marker-end="url(#ar)"/><path d="M620 300 V 328" marker-end="url(#ar)"/>
<path d="M620 400 V 428" marker-end="url(#ar)"/><path d="M620 500 V 528" marker-end="url(#ar)"/>
<path d="M460 168 H 492" marker-end="url(#ar)"/>
</g>

<!-- before / after -->
<text x="780" y="122" class="k">BEFORE → AFTER</text>
<rect x="780" y="136" width="380" height="464" rx="4" class="c"/>
<g>
<text x="800" y="168" class="s">Setup time</text>
<text x="800" y="192" class="b" style="fill:#B42318" fill="#B42318">20–25 days</text>
<text x="940" y="192" class="b">→</text>
<text x="964" y="192" class="h2" style="fill:#0F766E">~30 min</text>
<text x="964" y="212" class="s">3–4 days at worst</text>
<line x1="800" y1="230" x2="1140" y2="230" class="hl"/>
<text x="800" y="258" class="s">Who builds a bot</text>
<text x="800" y="282" class="b">Engineers + QA, custom code</text>
<text x="800" y="304" class="h2" style="fill:#0F766E">→ Implementation, no code</text>
<line x1="800" y1="322" x2="1140" y2="322" class="hl"/>
<text x="800" y="350" class="s">Engineering cost per sprint</text>
<text x="800" y="374" class="b">~2 engineers + 1 QA on bot builds</text>
<text x="800" y="396" class="h2" style="fill:#0F766E">→ Returned to product work</text>
<line x1="800" y1="414" x2="1140" y2="414" class="hl"/>
<text x="800" y="442" class="s">Changes after go-live</text>
<text x="800" y="466" class="b">Engineering ticket</text>
<text x="800" y="488" class="h2" style="fill:#0F766E">→ Toggled by implementation</text>
<line x1="800" y1="506" x2="1140" y2="506" class="hl"/>
<text x="800" y="534" class="s">Scale</text>
<text x="800" y="558" class="b">10–15 practices at the start</text>
<text x="800" y="580" class="h2" style="fill:#0F766E">→ ~100 practices, ~120 locations</text>
</g>
<text x="780" y="634" class="s">Custom bots kept as a separate, higher-effort path:</text>
<text x="780" y="652" class="s">4–5 practices (8–10 locations) with very specific flows.</text>
</svg>
