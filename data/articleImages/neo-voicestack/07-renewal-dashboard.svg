<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<title>Renewal dashboard redesign: the original activity report led with declining metrics in internal language; the redesign reads as a six-fold narrative for the practice owner, verdict, reach, recovery, disposition, handoff attribution and opportunity, framing NEO as first responder on every call.</title>
<defs><style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#595959}
.h{font-size:18px;font-weight:600;fill:#111}
.h2{font-size:15px;font-weight:600;fill:#111}
.b{font-size:14px;fill:#111}
.m{font-size:13px;fill:#595959}
.s{font-size:12px;fill:#595959}
.w{fill:#fff}
.c{fill:#fff;stroke:#e6e6e6;stroke-width:1.5}
.r{fill:#fafafa;stroke:#e6e6e6;stroke-width:1.5}
.a{stroke:#111;stroke-width:1.5;fill:none}
.ad{stroke:#8a8a8a;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.hl{stroke:#e6e6e6;stroke-width:1.5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
</defs>

<rect width="1200" height="700" fill="#fff"/>
<text x="40" y="48" class="k">REDESIGN · RENEWAL DASHBOARD FOR PRACTICE OWNERS</text>
<text x="40" y="76" class="h">From an activity report to a value argument</text>

<!-- BEFORE -->
<text x="40" y="126" class="k">BEFORE · ACTIVITY REPORT</text>
<rect x="40" y="142" width="420" height="508" rx="4" class="c"/>
<g>
<rect x="60" y="162" width="185" height="90" rx="4" class="r"/>
<rect x="255" y="162" width="185" height="90" rx="4" class="r"/>
<rect x="60" y="262" width="185" height="90" rx="4" class="r"/>
<rect x="255" y="262" width="185" height="90" rx="4" class="r"/>
<g fill="#d9d9d9">
<rect x="76" y="180" width="90" height="8"/><rect x="271" y="180" width="110" height="8"/>
<rect x="76" y="280" width="70" height="8"/><rect x="271" y="280" width="100" height="8"/>
</g>
<g style="font-size:24px;font-weight:600" fill="#B42318">
<text x="76" y="230">↓ ––%</text><text x="271" y="230">↓ ––%</text><text x="76" y="330">↓ ––</text><text x="271" y="330">––</text>
</g>
<rect x="60" y="364" width="380" height="160" rx="4" class="r"/>
<polyline points="80,500 140,470 200,486 260,440 320,460 380,430 420,450" fill="none" stroke="#bdbdbd" stroke-width="2"/>
<rect x="60" y="536" width="380" height="94" rx="4" class="r"/>
<g fill="#d9d9d9"><rect x="76" y="556" width="300" height="8"/><rect x="76" y="576" width="260" height="8"/><rect x="76" y="596" width="280" height="8"/></g>
</g>
<g style="font-size:12px;font-weight:700" text-anchor="middle">
<circle cx="460" cy="162" r="12" fill="#B42318"/><text x="460" y="166" class="w">1</text>
<circle cx="460" cy="536" r="12" fill="#B42318"/><text x="460" y="540" class="w">2</text>
</g>

<!-- notes between -->
<g>
<text x="490" y="182" class="h2" style="fill:#B42318">1  Declining metrics first</text>
<text x="490" y="226" class="h2" style="fill:#B42318">2  Internal terminology</text>
<text x="490" y="248" class="m">Labels meant for the team,</text>
<text x="490" y="266" class="m">not the practice owner</text>
<line x1="490" y1="296" x2="660" y2="296" class="hl"/>
<text x="490" y="330" class="k">REFRAME</text>
<text x="490" y="356" class="b">NEO as the first responder</text>
<text x="490" y="376" class="b">on every call, not a handler</text>
<text x="490" y="396" class="b">with a pass/fail rate</text>
<path d="M490 430 H 652" class="a" marker-end="url(#ar)"/>
<text x="490" y="470" class="s">First built with a real</text>
<text x="490" y="486" class="s">practice's data (anonymised)</text>
</g>

<!-- AFTER -->
<text x="680" y="126" class="k">AFTER · SIX-FOLD NARRATIVE</text>
<rect x="680" y="142" width="480" height="508" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<g>
<rect x="700" y="162" width="440" height="96" rx="4" fill="#111"/>
<text x="720" y="190" fill="#bdbdbd" style="font-size:12px;font-weight:600;letter-spacing:.08em">1 · VERDICT</text>
<rect x="720" y="206" width="260" height="12" fill="#fff" opacity=".9"/>
<rect x="720" y="228" width="180" height="10" fill="#fff" opacity=".4"/>

<rect x="700" y="268" width="215" height="84" rx="4" class="r"/>
<text x="716" y="292" class="k">2 · REACH</text>
<rect x="716" y="310" width="120" height="14" fill="#111"/><rect x="716" y="330" width="80" height="8" fill="#d9d9d9"/>
<rect x="925" y="268" width="215" height="84" rx="4" class="r"/>
<text x="941" y="292" class="k">3 · RECOVERY</text>
<rect x="941" y="310" width="100" height="14" fill="#0F766E"/><rect x="941" y="330" width="120" height="8" fill="#d9d9d9"/>

<rect x="700" y="362" width="440" height="96" rx="4" class="r"/>
<text x="716" y="386" class="k">4 · DISPOSITION</text>
<rect x="716" y="404" width="160" height="22" fill="#0F766E"/><rect x="876" y="404" width="140" height="22" fill="#B54708" opacity=".75"/><rect x="1016" y="404" width="108" height="22" fill="#d9d9d9"/>
<rect x="716" y="436" width="200" height="8" fill="#d9d9d9"/>

<rect x="700" y="468" width="440" height="84" rx="4" class="r"/>
<text x="716" y="492" class="k">5 · HANDOFF ATTRIBUTION</text>
<rect x="716" y="510" width="300" height="8" fill="#d9d9d9"/><rect x="716" y="528" width="240" height="8" fill="#d9d9d9"/>

<rect x="700" y="562" width="440" height="72" rx="4" fill="#FEF4E6"/>
<text x="716" y="586" class="k" style="fill:#B54708">6 · OPPORTUNITY</text>
<rect x="716" y="604" width="260" height="8" fill="#e8c9a3"/>
</g>
</svg>
