<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<title>Roadmap alignment: inputs from the CEO, the engineering tech lead, customer success and implementation were synthesised into shared priorities and a 90-day roadmap of four features, each with a written justification for leadership.</title>
<defs><style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#595959}
.h{font-size:18px;font-weight:600;fill:#111}
.h2{font-size:15px;font-weight:600;fill:#111}
.b{font-size:14px;fill:#111}
.m{font-size:13px;fill:#595959}
.s{font-size:12px;fill:#595959}
.w{fill:#fff}
.c{fill:#fff;stroke:#e6e6e6;stroke-width:1.5}
.r{fill:#fafafa;stroke:#e6e6e6;stroke-width:1.5}
.a{stroke:#111;stroke-width:1.5;fill:none}
.ad{stroke:#8a8a8a;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.hl{stroke:#e6e6e6;stroke-width:1.5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
</defs>

<rect width="1200" height="600" fill="#fff"/>
<text x="40" y="48" class="k">ALIGNMENT · 90-DAY ROADMAP</text>
<text x="40" y="76" class="h">Four sets of priorities, synthesised into one plan</text>

<text x="40" y="128" class="k">STAKEHOLDER INPUT</text>
<text x="470" y="128" class="k">SYNTHESIS</text>
<text x="830" y="128" class="k">ROADMAP PROPOSAL</text>

<g>
<rect x="40" y="146" width="340" height="88" rx="4" class="r"/>
<text x="58" y="176" class="h2">CEO</text>
<text x="58" y="198" class="m">A defined share of revenue from AI;</text>
<text x="58" y="218" class="m">prove an "AI-first phone system"</text>

<rect x="40" y="246" width="340" height="88" rx="4" class="r"/>
<text x="58" y="276" class="h2">Engineering tech lead</text>
<text x="58" y="298" class="m">A stable foundation before</text>
<text x="58" y="318" class="m">building more on top</text>

<rect x="40" y="346" width="340" height="88" rx="4" class="r"/>
<text x="58" y="376" class="h2">Customer success</text>
<text x="58" y="398" class="m">Customer escalations and</text>
<text x="58" y="418" class="m">renewal risk</text>

<rect x="40" y="446" width="340" height="88" rx="4" class="r"/>
<text x="58" y="476" class="h2">Implementation</text>
<text x="58" y="498" class="m">Setup effort per practice;</text>
<text x="58" y="518" class="m">onboarding speed</text>
</g>

<g class="a">
<path d="M380 190 C 425 190, 425 330, 462 330" marker-end="url(#ar)"/>
<path d="M380 290 C 420 290, 420 336, 462 336" marker-end="url(#ar)"/>
<path d="M380 390 C 420 390, 420 344, 462 344" marker-end="url(#ar)"/>
<path d="M380 490 C 425 490, 425 350, 462 350" marker-end="url(#ar)"/>
</g>

<rect x="470" y="186" width="300" height="300" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="490" y="220" class="k">SHARED PRIORITIES</text>
<g class="b">
<text x="490" y="256">US stabilisation before new</text>
<text x="490" y="276">markets (UK, AU paused)</text>
<line x1="490" y1="294" x2="750" y2="294" class="hl"/>
<text x="490" y="322">Deal-driven, revenue-linked</text>
<text x="490" y="342">features first</text>
<line x1="490" y1="360" x2="750" y2="360" class="hl"/>
<text x="490" y="388">Run NEO as a product: fix churn</text>
<text x="490" y="408">risks, defer one-off requests</text>
<line x1="490" y1="426" x2="750" y2="426" class="hl"/>
<text x="490" y="454">Balance velocity with a</text>
<text x="490" y="474">buildable foundation</text>
</g>

<path d="M770 336 H 822" class="a" marker-end="url(#ar)"/>

<g>
<rect x="830" y="146" width="330" height="388" rx="4" class="c"/>
<g style="font-size:12px;font-weight:700">
<rect x="850" y="166" width="38" height="24" rx="12" fill="#111"/><text x="869" y="182" text-anchor="middle" class="w">F1</text>
<rect x="850" y="250" width="38" height="24" rx="12" fill="#0F766E"/><text x="869" y="266" text-anchor="middle" class="w">F2</text>
<rect x="850" y="334" width="38" height="24" rx="12" fill="#111"/><text x="869" y="350" text-anchor="middle" class="w">F3</text>
<rect x="850" y="418" width="38" height="24" rx="12" fill="#111"/><text x="869" y="434" text-anchor="middle" class="w">F4</text>
</g>
<text x="900" y="183" class="h2">Memory</text>
<text x="900" y="267" class="h2">Warm transfer with whisper</text>
<text x="900" y="289" class="s">Detailed in this case study</text>
<text x="900" y="351" class="h2">Conversation design</text>
<text x="900" y="435" class="h2">Named transfer as fulfilment</text>
<line x1="850" y1="226" x2="1140" y2="226" class="hl"/>
<line x1="850" y1="310" x2="1140" y2="310" class="hl"/>
<line x1="850" y1="394" x2="1140" y2="394" class="hl"/>
<text x="850" y="500" class="m">Each feature written up with</text>
<text x="850" y="518" class="m">problem data + justification</text>
</g>
</svg>
